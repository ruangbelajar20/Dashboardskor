<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Skor Interaktif Kelompok</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            text-align: center;
            font-size: 0.95rem;
        }
        .scoreboard-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
        }
        .group-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 280px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .group-card h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .score-box {
            background-color: #ecf0f1;
            width: 100%;
            border-radius: 8px;
            padding: 15px 0;
            margin: 15px 0;
        }
        .score-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1;
        }
        .score-label {
            font-size: 0.85rem;
            color: #7f8c8d;
            font-weight: bold;
            margin-top: 5px;
        }
        .avg-display {
            font-size: 0.9rem;
            color: #e67e22;
            font-weight: bold;
            margin-top: 8px;
        }
        
        /* Grid Input Anggota */
        .members-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }
        .members-grid input {
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            transition: border-color 0.3s;
        }
        .members-grid input:focus {
            outline: none;
            border-color: #3498db;
        }
        /* Anggota ke-7 membentang di bawah jika ganjil */
        .member-7 {
            grid-column: span 2;
        }

        /* Animasi Label Bertingkat */
        .feedback-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            opacity: 0;
            transform: scale(0.5);
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* Keyframe untuk efek Popup/Bounce */
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .show-anim {
            animation: popUp 0.4s ease forwards;
        }

        /* Warna berdasarkan tingkat nilai */
        .kurang { background-color: #e74c3c; }       /* Merah */
        .cukup { background-color: #f39c12; }        /* Oranye */
        .baik { background-color: #3498db; }         /* Biru */
        .sangat-baik { background-color: #2ecc71; }  /* Hijau */
        
    </style>
</head>
<body>

    <h1>Papan Skor Penilaian</h1>
    <p class="subtitle">Skor akan terhitung otomatis saat nilai anggota dimasukkan.<br>Predikat (Animasi) didasarkan pada <b>Rata-rata</b> kelompok.</p>

    <div class="scoreboard-container" id="scoreboard">
        <!-- Kartu Kelompok akan di-generate oleh JavaScript -->
    </div>

    <script>
        const totalGroups = 6;
        const membersPerGroup = 7;
        const container = document.getElementById('scoreboard');

        // Render 6 kolom/kartu kelompok
        for (let i = 1; i <= totalGroups; i++) {
            const card = document.createElement('div');
            card.className = 'group-card';
            
            // Buat form input untuk anggota
            let inputsHtml = `<div class="members-grid">`;
            for(let j = 1; j <= membersPerGroup; j++) {
                // Member ke-7 dibuat agar spanning 2 kolom supaya rapi
                let extraClass = (j === 7) ? 'member-7' : '';
                inputsHtml += `
                    <input type="number" 
                           class="${extraClass}" 
                           id="g${i}-m${j}" 
                           placeholder="Anggota ${j}" 
                           min="0" max="100"
                           oninput="hitungOtomatis(${i})">
                `;
            }
            inputsHtml += `</div>`;

            card.innerHTML = `
                <h2>Kelompok ${i}</h2>
                <div class="score-box">
                    <div class="score-display" id="total-${i}">0</div>
                    <div class="score-label">TOTAL SKOR</div>
                    <div class="avg-display" id="avg-${i}">Rata-rata: 0</div>
                </div>
                ${inputsHtml}
                <div class="feedback-badge" id="feedback-${i}">-</div>
            `;
            container.appendChild(card);
        }

        // Fungsi Kalkulasi Otomatis dan Animasi
        function hitungOtomatis(groupId) {
            let total = 0;
            let countValid = 0;

            // Loop untuk mengambil nilai dari ke-7 anggota
            for(let j = 1; j <= membersPerGroup; j++) {
                const inputVal = document.getElementById(`g${groupId}-m${j}`).value;
                if (inputVal !== '' && !isNaN(inputVal)) {
                    total += parseFloat(inputVal);
                    countValid++;
                }
            }

            const totalDisplay = document.getElementById(`total-${groupId}`);
            const avgDisplay = document.getElementById(`avg-${groupId}`);
            const feedbackBadge = document.getElementById(`feedback-${groupId}`);

            // Menghitung Rata-rata
            let rataRata = 0;
            if (countValid > 0) {
                rataRata = Math.round(total / countValid);
            }

            // Update Angka di layar
            totalDisplay.innerText = total;
            avgDisplay.innerText = `Rata-rata: ${rataRata}`;

            // Jika form dikosongkan, hilangkan badge
            if (countValid === 0) {
                feedbackBadge.style.opacity = 0;
                feedbackBadge.removeAttribute('data-cat');
                return;
            }

            // Logika Bertingkat (berdasarkan Rata-rata)
            let kategori = '';
            let kelasWarna = '';

            if (rataRata < 60) {
                kategori = 'Kurang';
                kelasWarna = 'kurang';
            } else if (rataRata >= 60 && rataRata < 80) {
                kategori = 'Cukup';
                kelasWarna = 'cukup';
            } else if (rataRata >= 80 && rataRata <= 90) {
                kategori = 'Baik';
                kelasWarna = 'baik';
            } else if (rataRata > 90) {
                kategori = 'Sangat Baik';
                kelasWarna = 'sangat-baik';
            }

            // Cek apakah kategorinya berubah untuk menghindari animasi memantul berulang 
            // setiap kali kita mengetik satu angka (hanya memantul saat predikat berubah)
            const currentCat = feedbackBadge.getAttribute('data-cat');

            if (currentCat !== kategori) {
                // Reset animasi & kelas
                feedbackBadge.className = 'feedback-badge ' + kelasWarna;
                feedbackBadge.innerText = kategori;
                feedbackBadge.setAttribute('data-cat', kategori);
                
                // Force reflow
                void feedbackBadge.offsetWidth; 
                
                // Tambahkan kelas animasi dan tampilkan
                feedbackBadge.classList.add('show-anim');
                feedbackBadge.style.opacity = 1;
            } else {
                // Jika masih dalam kategori yang sama, pastikan tetap terlihat
                feedbackBadge.style.opacity = 1;
            }
        }
    </script>

</body>
</html>
