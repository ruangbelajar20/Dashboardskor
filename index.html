<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport yang dioptimalkan untuk mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Penilaian - Sejarah</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #fdbb2d;
            --text-dark: #2c3e50;
            --bg-card: rgba(255, 255, 255, 0.95);
        }

        /* --- GLOBAL LAYOUT --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            margin: 0;
            padding: 10px; /* Padding dikecilkan untuk mobile */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 900px; /* Ukuran maksimal untuk laptop */
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px; /* Desain lebih compact */
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
            margin-top: 10px;
        }

        /* --- TYPOGRAPHY COMPACT --- */
        h1 { font-size: 1.5rem; margin-bottom: 15px; text-align: center; color: var(--primary); }
        h2 { font-size: 1.3rem; margin: 0; color: var(--primary); }
        h3 { font-size: 1.1rem; margin: 0 0 10px 0; color: var(--primary); }
        h4 { font-size: 0.95rem; margin: 0 0 10px 0; color: #444; }

        /* --- FORM ELEMENTS --- */
        .form-group { margin-bottom: 12px; }
        
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary);
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid rgba(26, 42, 108, 0.15);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            background: #fff;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 8px rgba(26, 42, 108, 0.2);
        }

        /* --- BUTTONS --- */
        button {
            background: linear-gradient(45deg, var(--primary), #2980b9);
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button:active { transform: scale(0.98); } /* Efek klik untuk HP */

        .btn-kembali {
            background: linear-gradient(45deg, #7f8c8d, #95a5a6);
            width: auto;
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-top: 0;
        }
        /* Efek ketika tombol sedang ditahan/diklik */
        .btn-kembali:active {
            transform: scale(0.90);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
        }
        
        /* Efek warna baru setelah diklik (Merah/Oranye) */
        .btn-kembali.diklik {
            background: linear-gradient(45deg, #e74c3c, #c0392b) !important;
            color: white;
            transform: scale(0.95);
            transition: all 0.2s ease;
        }

        .btn-submit-nilai { background: linear-gradient(45deg, #27ae60, #2ecc71); margin-top: 15px; }

        /* --- GRADING SCREEN & CARDS --- */
        #grading-screen { display: none; }

        .group-tabs {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 15px;
            overflow-x: auto; /* Bisa di-scroll menyamping di HP */
            padding-bottom: 10px;
            scrollbar-width: thin;
        }

        .tab-btn {
            background: rgba(0, 0, 0, 0.05);
            color: var(--primary);
            border: 1px solid var(--primary);
            width: auto;
            white-space: nowrap;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 0;
        }

        .tab-btn.active { background: var(--primary); color: white; }

        .group-content { display: none; }
        .group-content.active { display: block; }

        .member-card {
            background: #fdfdfd;
            border-left: 4px solid var(--accent);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Grid Aspek Penilaian lebih padat */
        .aspect-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        /* --- MEDIA QUERIES (RESPONSIF MOBILE) --- */
        @media screen and (max-width: 600px) {
            .container { padding: 15px; border-radius: 10px; }
            .aspect-grid { grid-template-columns: repeat(2, 1fr); } /* 2 Kolom di layar HP */
            h1 { font-size: 1.3rem; }
            .header-grading { flex-direction: column; align-items: flex-start !important; gap: 10px; }
            .btn-kembali { width: 100%; text-align: center; }
        }

        @media screen and (max-width: 380px) {
            .aspect-grid { grid-template-columns: 1fr; } /* 1 Kolom untuk HP sangat kecil */
        }
    </style>
</head>
<body>

<!-- KUMPULAN AUDIO (Server Google - Anti Error) -->
<audio id="sound-fail" src="https://actions.google.com/sounds/v1/cartoon/siren_whistle.ogg" preload="auto"></audio> 
<audio id="sound-cukup" src="https://actions.google.com/sounds/v1/cartoon/woodpecker.ogg" preload="auto"></audio> 
<audio id="sound-baik" src="https://actions.google.com/sounds/v1/cartoon/magic_chime.ogg" preload="auto"></audio> 
<audio id="sound-sempurna" src="https://actions.google.com/sounds/v1/crowds/crowd_cheering.ogg" preload="auto"></audio>

<div class="container animate__animated animate__fadeInDown" id="setup-screen">
    <h1>⚙️ Setup Penilaian</h1>
    
    <div class="aspect-grid">
        <div class="form-group">
            <label>Pilih Kelas</label>
            <select id="kelas">
                <option value="X">Kelas X</option>
                <option value="XI">Kelas XI</option>
            </select>
        </div>
        <div class="form-group">
            <label>Pilih Jurusan</label>
            <select id="jurusan">
                <option value="TJKT">TJKT</option>
                <option value="TBSM 1">TBSM 1</option>
                <option value="TBSM 2">TBSM 2</option>
                <option value="TKR">TKR</option>
                <option value="FARMASI">FARMASI</option>
                <option value="KEPERAWATAN 1">KEPERAWATAN 1</option>
                <option value="KEPERAWATAN 2">KEPERAWATAN 2</option>
            </select>
        </div>
    </div>

    <div class="aspect-grid" style="margin-top: 5px;">
        <div class="form-group">
            <label>Jml Kelompok</label>
            <input type="number" id="jmlKelompok" min="1" value="4">
        </div>
        <div class="form-group">
            <label>Anggota/Kelompok</label>
            <input type="number" id="jmlAnggota" min="1" value="5">
        </div>
        <div class="form-group">
            <label>Jml Aspek</label>
            <input type="number" id="jmlAspek" min="1" value="3">
        </div>
    </div>

    <button onclick="generateGradingUI()">🚀 Mulai Mode Penilaian</button>
</div>

<div class="container animate__animated" id="grading-screen">
    <div class="header-grading" style="display: flex; justify-content: space-between; align-items: center;">
        <h2 id="judul-grading">Penilaian</h2>
        <button class="btn-kembali" onclick="kembaliKeSetup(this)">Kembali</button>
    </div>
    
    <div class="group-tabs" id="tabs-container"></div>
    <div id="groups-container"></div>
</div>

<script>
    // URL WEB APP ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxO4syP40MFA51plRQ63jWKTwZZM0MCSrHcfm061nnNvVHzMW-3nBZCb6WgbYg5Zj9T/exec"; 
    let globalConfig = {};

    function generateGradingUI() {
        globalConfig = {
            kelas: document.getElementById('kelas').value,
            jurusan: document.getElementById('jurusan').value,
            jmlKelompok: parseInt(document.getElementById('jmlKelompok').value),
            jmlAnggota: parseInt(document.getElementById('jmlAnggota').value),
            jmlAspek: parseInt(document.getElementById('jmlAspek').value)
        };

        const setupScreen = document.getElementById('setup-screen');
        setupScreen.classList.remove('animate__fadeInDown');
        setupScreen.classList.add('animate__zoomOut');
        
        setTimeout(() => {
            setupScreen.style.display = 'none';
            const gradingScreen = document.getElementById('grading-screen');
            gradingScreen.style.display = 'block';
            gradingScreen.classList.add('animate__fadeInUp');
            
            document.getElementById('judul-grading').innerText = `🏆 ${globalConfig.kelas} ${globalConfig.jurusan}`;

            buildTabsAndContent();
        }, 500);
    }

    function buildTabsAndContent() {
        const tabsContainer = document.getElementById('tabs-container');
        const groupsContainer = document.getElementById('groups-container');
        
        tabsContainer.innerHTML = '';
        groupsContainer.innerHTML = '';

        for (let i = 1; i <= globalConfig.jmlKelompok; i++) {
            const tabBtn = document.createElement('button');
            tabBtn.className = `tab-btn animate__animated animate__fadeInRight ${i === 1 ? 'active' : ''}`;
            tabBtn.style.animationDelay = `${i * 0.05}s`;
            tabBtn.innerText = `Kelompok ${i}`;
            tabBtn.onclick = () => switchTab(i);
            tabsContainer.appendChild(tabBtn);

            const groupDiv = document.createElement('div');
            groupDiv.id = `group-${i}`;
            groupDiv.className = `group-content animate__animated animate__fadeIn ${i === 1 ? 'active' : ''}`;
            
            let groupHTML = `<h3>Data Nilai - Kelompok ${i}</h3>`;
            
            for (let j = 1; j <= globalConfig.jmlAnggota; j++) {
                groupHTML += `<div class="member-card">
                                <h4>👤 Anggota Ke-${j}</h4>
                                <div class="aspect-grid">`;
                
                for (let k = 1; k <= globalConfig.jmlAspek; k++) {
                    groupHTML += `<div>
                                    <label>Aspek ${k}</label>
                                    <input type="number" class="input-nilai g${i}-m${j}" min="0" max="100" placeholder="0-100">
                                  </div>`;
                }
                groupHTML += `</div></div>`;
            }
            
            groupHTML += `<button class="btn-submit-nilai" onclick="hitungDanSimpan(${i})">✨ Hitung & Simpan</button>`;
            groupDiv.innerHTML = groupHTML;
            groupsContainer.appendChild(groupDiv);
        }
    }

    function switchTab(groupId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.group-content').forEach(content => {
            content.classList.remove('active', 'animate__fadeIn');
        });
        
        document.querySelectorAll('.tab-btn')[groupId - 1].classList.add('active');
        const activeGroup = document.getElementById(`group-${groupId}`);
        activeGroup.classList.add('active');
        
        void activeGroup.offsetWidth; 
        activeGroup.classList.add('animate__fadeIn');
    }

    function mainkanSuara(idAudio) {
        const audio = document.getElementById(idAudio);
        if(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio dicegah browser", e));
        }
    }

    function hitungDanSimpan(groupId) {
        let totalNilaiKelompok = 0;
        let totalInput = globalConfig.jmlAnggota * globalConfig.jmlAspek;
        let nilaiMasuk = 0;
        let detailAnggotaArray = [];

        for (let j = 1; j <= globalConfig.jmlAnggota; j++) {
            let totalNilaiMemberIni = 0;
            let inputsMember = document.querySelectorAll(`.g${groupId}-m${j}`);
            
            inputsMember.forEach(input => {
                let val = parseFloat(input.value);
                if (!isNaN(val)) {
                    totalNilaiMemberIni += val;
                    totalNilaiKelompok += val;
                    nilaiMasuk++;
                }
            });

            // Hitung nilai genap untuk "Anggota"
            let rataRataMemberIni = Math.round(totalNilaiMemberIni / globalConfig.jmlAspek);
            detailAnggotaArray.push(`Anggota ${j}: ${rataRataMemberIni}`);
        }

        if (nilaiMasuk < totalInput) {
            Swal.fire({
                title: 'Data Belum Lengkap!',
                text: 'Pastikan semua aspek nilai sudah terisi.',
                icon: 'warning',
                showClass: { popup: 'animate__animated animate__shakeX' }
            });
            return;
        }

        let nilaiAkhir = Math.round(totalNilaiKelompok / totalInput);
        let rataRataAnggota = Math.round(totalNilaiKelompok / globalConfig.jmlAnggota);
        let stringDetailAnggota = detailAnggotaArray.join(" | ");

        tampilkanAnimasiSejarah(groupId, nilaiAkhir, rataRataAnggota, stringDetailAnggota);
    }

    function tampilkanAnimasiSejarah(groupId, nilaiAkhir, rataRataAnggota, stringDetailAnggota) {
        let status = "";
        let tema = {};

        if (nilaiAkhir < 60) {
            status = "Tidak Tercapai";
            mainkanSuara('sound-fail'); 
            tema = { title: 'Masa Sulit Romusha!', text: `Skor: ${nilaiAkhir}. Butuh keajaiban!`, icon: 'error', animasi: 'animate__headShake', bg: '#fadbd8' };
        } else if (nilaiAkhir >= 60 && nilaiAkhir <= 80) {
            status = "Cukup Tercapai";
            mainkanSuara('sound-cukup'); 
            tema = { title: 'Pelatihan PETA!', text: `Skor: ${nilaiAkhir}. Cukup baik, tingkatkan lagi!`, icon: 'warning', animasi: 'animate__pulse', bg: '#fdebd0' };
        } else if (nilaiAkhir >= 81 && nilaiAkhir <= 90) {
            status = "Tercapai";
            mainkanSuara('sound-baik'); 
            tema = { title: 'Sidang BPUPKI!', text: `Skor: ${nilaiAkhir}. Mantap! Ide tereksekusi baik!`, icon: 'info', animasi: 'animate__tada', bg: '#d6eaf8' };
        } else if (nilaiAkhir >= 91 && nilaiAkhir <= 100) {
            status = "Sangat Tercapai";
            mainkanSuara('sound-sempurna'); 
            
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());

            tema = { title: 'MERDEKA!! 🇮🇩', text: `Skor: ${nilaiAkhir}. Kerja sama yang luar biasa!`, icon: 'success', animasi: 'animate__bounceIn', bg: '#d5f5e3' };
        }

        Swal.fire({
            title: tema.title,
            text: tema.text,
            icon: tema.icon,
            background: tema.bg,
            showClass: { popup: `animate__animated ${tema.animasi}` },
            hideClass: { popup: 'animate__animated animate__zoomOut' },
            confirmButtonText: '💾 Simpan',
            showCancelButton: true,
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                kirimKeSpreadsheet(groupId, nilaiAkhir, rataRataAnggota, status, stringDetailAnggota);
            }
        });
    }

    function kirimKeSpreadsheet(groupId, nilaiAkhir, rataRataAnggota, status, stringDetailAnggota) {
        Swal.fire({ title: 'Menyandikan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

        const dataKirim = {
            kelas: globalConfig.kelas,
            jurusan: globalConfig.jurusan,
            kelompok: `Kelompok ${groupId}`,
            rataRataAnggota: rataRataAnggota,
            nilaiAkhir: nilaiAkhir,
            predikat: status,
            detailAnggota: stringDetailAnggota
        };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(dataKirim) })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                Swal.fire({ title: 'Tersimpan!', text: 'Sejarah diabadikan.', icon: 'success', showClass: { popup: 'animate__animated animate__zoomIn' } });
                const btn = document.querySelector(`#group-${groupId} .btn-submit-nilai`);
                btn.disabled = true;
                btn.innerHTML = "✅ Data Tersimpan";
                btn.style.background = "#7f8c8d";
            }
        }).catch(error => { Swal.fire('Gagal', 'Periksa internet Anda.', 'error'); });
    }
    function kembaliKeSetup(tombol) {
    // 1. Ubah teks tombol
    tombol.innerText = "Memuat ulang...";

    // 2. Tambahkan class CSS 'diklik' untuk merubah warnanya
    tombol.classList.add("diklik");

    // 3. Beri jeda 0.3 detik (300 milidetik) agar animasi terlihat, lalu reload
    setTimeout(() => {
        location.reload();
    }, 300);
}
</script>

</body>
</html>
