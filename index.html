<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Skor Interaktif</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .scoreboard-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
        }
        .group-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 250px;
            padding: 20px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .group-card h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .group-card p {
            margin: 5px 0 15px;
            font-size: 0.85rem;
            color: #7f8c8d;
        }
        .score-display {
            font-size: 4rem;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 15px;
            transition: color 0.3s;
        }
        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
        }
        .input-group button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .input-group button:hover {
            background-color: #2980b9;
        }
        
        /* Animasi Label Bertingkat */
        .feedback-badge {
            margin-top: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.3s ease;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* Keyframe untuk efek Popup/Bounce */
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .show-anim {
            animation: popUp 0.5s ease forwards;
        }

        /* Warna berdasarkan tingkat nilai */
        .kurang { background-color: #e74c3c; }       /* Merah */
        .cukup { background-color: #f39c12; }        /* Oranye */
        .baik { background-color: #3498db; }         /* Biru */
        .sangat-baik { background-color: #2ecc71; }  /* Hijau */
        
    </style>
</head>
<body>

    <h1>Papan Skor Penilaian</h1>

    <div class="scoreboard-container" id="scoreboard">
        <!-- Kartu Kelompok akan di-generate oleh JavaScript -->
    </div>

    <script>
        // Data Kelompok (6 Kelompok)
        const totalGroups = 6;
        const container = document.getElementById('scoreboard');

        // Render 6 kolom/kartu kelompok
        for (let i = 1; i <= totalGroups; i++) {
            const card = document.createElement('div');
            card.className = 'group-card';
            card.innerHTML = `
                <h2>Kelompok ${i}</h2>
                <p>Anggota: 6 - 7 Orang</p>
                <div class="score-display" id="score-${i}">0</div>
                <div class="input-group">
                    <input type="number" id="input-${i}" placeholder="Nilai (0-100)">
                    <button onclick="berikanNilai(${i})">Beri Nilai</button>
                </div>
                <div class="feedback-badge" id="feedback-${i}">-</div>
            `;
            container.appendChild(card);
        }

        // Fungsi untuk memproses dan menampilkan animasi
        function berikanNilai(id) {
            const input = document.getElementById(`input-${id}`);
            const scoreDisplay = document.getElementById(`score-${id}`);
            const feedbackBadge = document.getElementById(`feedback-${id}`);
            
            let nilai = parseInt(input.value);

            // Validasi input
            if (isNaN(nilai)) {
                alert("Harap masukkan angka yang valid!");
                return;
            }

            // Update teks skor di layar
            scoreDisplay.innerText = nilai;

            // Reset animasi
            feedbackBadge.classList.remove('show-anim', 'kurang', 'cukup', 'baik', 'sangat-baik');
            
            // Force reflow agar animasi bisa diulang walau nilainya sama
            void feedbackBadge.offsetWidth;

            // Logika Bertingkat
            let kategori = '';
            let kelasWarna = '';

            if (nilai < 60) {
                kategori = 'Kurang';
                kelasWarna = 'kurang';
            } else if (nilai >= 60 && nilai < 80) {
                kategori = 'Cukup';
                kelasWarna = 'cukup';
            } else if (nilai >= 80 && nilai <= 90) {
                kategori = 'Baik';
                kelasWarna = 'baik';
            } else if (nilai > 90) {
                kategori = 'Sangat Baik';
                kelasWarna = 'sangat-baik';
            }

            // Terapkan teks dan kelas warna baru, lalu jalankan animasi
            feedbackBadge.innerText = kategori;
            feedbackBadge.classList.add(kelasWarna);
            feedbackBadge.classList.add('show-anim');
            
            // Kosongkan input setelah nilai dimasukkan (opsional)
            input.value = '';
        }
    </script>

</body>
</html>
