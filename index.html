<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Penilaian - Sejarah Jepang</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #fdbb2d;
            --text-dark: #2c3e50;
            --text-light: #ecf0f1;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Background gradien modern yang dinamis */
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Effect */
        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary);
        }

        select, input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(26, 42, 108, 0.2);
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(26, 42, 108, 0.2);
            outline: none;
            transform: translateY(-2px);
        }

        button {
            background: linear-gradient(45deg, var(--primary), #2980b9);
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            margin-top: 15px;
        }

        button:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 25px rgba(0,0,0,0.25);
        }

        /* Styling Halaman Penilaian */
        #grading-screen {
            display: none;
        }

        .group-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 15px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.5);
            color: var(--primary);
            border: 2px solid var(--primary);
            width: auto;
            white-space: nowrap;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: none;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .group-content {
            display: none;
        }

        .group-content.active {
            display: block;
        }

        .member-card {
            background: rgba(255, 255, 255, 0.9);
            border-left: 6px solid var(--accent);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .member-card:hover {
            transform: translateY(-3px);
        }

        .aspect-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .btn-submit-nilai {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
        }

        /* Animasi Kustom SweetAlert */
        .swal2-popup {
            border-radius: 20px !important;
            padding: 2em !important;
        }
    </style>
</head>
<body>

<audio id="sound-fail" src="https://www.soundjay.com/misc/sounds/fail-buzzer-01.mp3" preload="auto"></audio>
<audio id="sound-cukup" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>
<audio id="sound-baik" src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3" preload="auto"></audio>
<audio id="sound-sempurna" src="https://www.soundjay.com/human/sounds/applause-01.mp3" preload="auto"></audio>

<div class="container animate__animated animate__fadeInDown" id="setup-screen">
    <h1>⚙️ Setup Penilaian</h1>
    
    <div class="form-group">
        <label>Pilih Kelas</label>
        <select id="kelas">
            <option value="X">Kelas X</option>
            <option value="XI">Kelas XI</option>
        </select>
    </div>

    <div class="form-group">
        <label>Pilih Jurusan</label>
        <select id="jurusan">
            <option value="TJKT">TJKT</option>
            <option value="TBSM 1">TBSM 1</option>
            <option value="TBSM 2">TBSM 2</option>
            <option value="TKR">TKR</option>
            <option value="FARMASI">FARMASI</option>
            <option value="KEPERAWATAN 1">KEPERAWATAN 1</option>
            <option value="KEPERAWATAN 2">KEPERAWATAN 2</option>
        </select>
    </div>

    <div class="aspect-grid">
        <div class="form-group">
            <label>Jumlah Kelompok</label>
            <input type="number" id="jmlKelompok" min="1" value="4">
        </div>
        <div class="form-group">
            <label>Anggota / Kelompok</label>
            <input type="number" id="jmlAnggota" min="1" value="5">
        </div>
        <div class="form-group">
            <label>Jumlah Aspek</label>
            <input type="number" id="jmlAspek" min="1" value="3">
        </div>
    </div>

    <button onclick="generateGradingUI()">🚀 Mulai Mode Layar Proyektor</button>
</div>

<div class="container animate__animated" id="grading-screen">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
        <h2 id="judul-grading" style="margin: 0;">Penilaian Kelas</h2>
        <button onclick="location.reload()" style="width: auto; margin: 0; background: linear-gradient(45deg, #7f8c8d, #95a5a6);">Kembali ke Setup</button>
    </div>
    
    <hr style="border: 1px solid rgba(0,0,0,0.1); margin: 20px 0;">
    
    <div class="group-tabs" id="tabs-container"></div>
    <div id="groups-container"></div>
</div>

<script>
    // ===== GANTI URL INI DENGAN URL WEB APP GOOGLE SCRIPT ANDA =====
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgfQHqPWBJgG_3ABrOIAr8QTnzSKtTkBsJTppgil96K7YoC6ayitUCmKlConpORjb6/exec"; 

    let globalConfig = {};

    function generateGradingUI() {
        globalConfig = {
            kelas: document.getElementById('kelas').value,
            jurusan: document.getElementById('jurusan').value,
            jmlKelompok: parseInt(document.getElementById('jmlKelompok').value),
            jmlAnggota: parseInt(document.getElementById('jmlAnggota').value),
            jmlAspek: parseInt(document.getElementById('jmlAspek').value)
        };

        // Efek Transisi Layar
        const setupScreen = document.getElementById('setup-screen');
        setupScreen.classList.remove('animate__fadeInDown');
        setupScreen.classList.add('animate__zoomOut');
        
        setTimeout(() => {
            setupScreen.style.display = 'none';
            const gradingScreen = document.getElementById('grading-screen');
            gradingScreen.style.display = 'block';
            gradingScreen.classList.add('animate__fadeInUp');
            
            document.getElementById('judul-grading').innerText = `🏆 Kelas ${globalConfig.kelas} ${globalConfig.jurusan}`;

            buildTabsAndContent();
        }, 500); // Tunggu animasi selesai
    }

    function buildTabsAndContent() {
        const tabsContainer = document.getElementById('tabs-container');
        const groupsContainer = document.getElementById('groups-container');
        
        tabsContainer.innerHTML = '';
        groupsContainer.innerHTML = '';

        for (let i = 1; i <= globalConfig.jmlKelompok; i++) {
            const tabBtn = document.createElement('button');
            tabBtn.className = `tab-btn animate__animated animate__fadeInRight ${i === 1 ? 'active' : ''}`;
            tabBtn.style.animationDelay = `${i * 0.1}s`;
            tabBtn.innerText = `Kelompok ${i}`;
            tabBtn.onclick = () => switchTab(i);
            tabsContainer.appendChild(tabBtn);

            const groupDiv = document.createElement('div');
            groupDiv.id = `group-${i}`;
            groupDiv.className = `group-content animate__animated animate__fadeIn ${i === 1 ? 'active' : ''}`;
            
            let groupHTML = `<h3 style="color: var(--primary);">Data Nilai - Kelompok ${i}</h3>`;
            
            for (let j = 1; j <= globalConfig.jmlAnggota; j++) {
                groupHTML += `<div class="member-card">
                                <h4>👤 Siswa Ke-${j}</h4>
                                <div class="aspect-grid">`;
                
                for (let k = 1; k <= globalConfig.jmlAspek; k++) {
                    groupHTML += `<div>
                                    <label>Aspek ${k}</label>
                                    <input type="number" class="input-nilai g${i}-m${j}" min="0" max="100" placeholder="Skor 0-100">
                                  </div>`;
                }
                groupHTML += `</div></div>`;
            }
            
            groupHTML += `<button class="btn-submit-nilai" onclick="hitungDanSimpan(${i})">✨ Hitung & Simpan Kelompok ${i}</button>`;
            groupDiv.innerHTML = groupHTML;
            groupsContainer.appendChild(groupDiv);
        }
    }

    function switchTab(groupId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.group-content').forEach(content => {
            content.classList.remove('active');
            content.classList.remove('animate__fadeIn');
        });
        
        document.querySelectorAll('.tab-btn')[groupId - 1].classList.add('active');
        const activeGroup = document.getElementById(`group-${groupId}`);
        activeGroup.classList.add('active');
        
        // Paksa reflow untuk me-restart animasi
        void activeGroup.offsetWidth; 
        activeGroup.classList.add('animate__fadeIn');
    }

    function mainkanSuara(idAudio) {
        const audio = document.getElementById(idAudio);
        if(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio autoplay dicegah browser", e));
        }
    }

   function hitungDanSimpan(groupId) {
        let totalNilaiKelompok = 0;
        let totalInput = globalConfig.jmlAnggota * globalConfig.jmlAspek;
        let nilaiMasuk = 0;
        
        let detailAnggotaArray = []; // Array untuk menyimpan nilai tiap anggota

        // Looping untuk menghitung nilai MASING-MASING anggota
        for (let j = 1; j <= globalConfig.jmlAnggota; j++) {
            let totalNilaiMemberIni = 0;
            let inputsMember = document.querySelectorAll(`.g${groupId}-m${j}`);
            
            inputsMember.forEach(input => {
                let val = parseFloat(input.value);
                if (!isNaN(val)) {
                    totalNilaiMemberIni += val;
                    totalNilaiKelompok += val;
                    nilaiMasuk++;
                }
            });

            // Hitung rata-rata nilai untuk Siswa ke-j (Total nilai dia / jumlah aspek)
            let rataRataMemberIni = Math.round(totalNilaiMemberIni / globalConfig.jmlAspek);
            detailAnggotaArray.push(`Siswa ${j}: ${rataRataMemberIni}`);
        }

        if (nilaiMasuk < totalInput) {
            Swal.fire({
                title: 'Data Belum Lengkap!',
                text: 'Pastikan semua aspek nilai untuk seluruh anggota sudah terisi.',
                icon: 'warning',
                showClass: { popup: 'animate__animated animate__shakeX' }
            });
            return;
        }

        let nilaiAkhir = Math.round(totalNilaiKelompok / totalInput);
        let rataRataAnggota = (totalNilaiKelompok / globalConfig.jmlAnggota).toFixed(2);
        
        // Gabungkan array menjadi satu kalimat rapi (Siswa 1: 85 | Siswa 2: 90 | ...)
        let stringDetailAnggota = detailAnggotaArray.join(" | ");

        // Bawa data stringDetailAnggota ke fungsi berikutnya
        tampilkanAnimasiSejarah(groupId, nilaiAkhir, rataRataAnggota, stringDetailAnggota);
    }

    function tampilkanAnimasiSejarah(groupId, nilaiAkhir, rataRataAnggota, stringDetailAnggota) {
        let status = "";
        let tema = {};

        if (nilaiAkhir < 60) {
            status = "Tidak Tercapai";
            mainkanSuara('sound-fail'); // Akan bunyi Womp Womp
            tema = {
                title: 'Masa Sulit Romusha!',
                text: `Skor: ${nilaiAkhir}. Aduh, kelompok kalian butuh keajaiban!`,
                icon: 'error',
                animasi: 'animate__headShake',
                bg: '#fadbd8'
            };
        } else if (nilaiAkhir >= 60 && nilaiAkhir <= 80) {
            status = "Cukup Tercapai";
            mainkanSuara('sound-cukup'); // Akan bunyi Jangkrik
            tema = {
                title: 'Pelatihan Pasukan PETA!',
                text: `Skor: ${nilaiAkhir}. Cukup baik, tapi kurang greget. Tingkatkan lagi!`,
                icon: 'warning',
                animasi: 'animate__pulse',
                bg: '#fdebd0'
            };
        } else if (nilaiAkhir >= 81 && nilaiAkhir <= 90) {
            status = "Tercapai";
            mainkanSuara('sound-baik'); // Akan bunyi Anime Wow
            tema = {
                title: 'Sidang BPUPKI Sukses!',
                text: `Skor: ${nilaiAkhir}. Mantap! Ide kalian dieksekusi dengan sangat baik!`,
                icon: 'info',
                animasi: 'animate__tada',
                bg: '#d6eaf8'
            };
        } else if (nilaiAkhir >= 91 && nilaiAkhir <= 100) {
            status = "Sangat Tercapai";
            mainkanSuara('sound-sempurna'); // Akan bunyi Airhorn Heboh
            
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());

            tema = {
                title: 'MERDEKA!! 🇮🇩',
                text: `Skor: ${nilaiAkhir}. Sempurna! Kerja sama kelompok yang luar biasa!`,
                icon: 'success',
                animasi: 'animate__bounceIn',
                bg: '#d5f5e3'
            };
        }

        Swal.fire({
            title: tema.title,
            text: tema.text,
            icon: tema.icon,
            background: tema.bg,
            showClass: { popup: `animate__animated ${tema.animasi}` },
            hideClass: { popup: 'animate__animated animate__zoomOut' },
            confirmButtonText: '💾 Simpan ke Database',
            showCancelButton: true,
            cancelButtonText: 'Batal',
            backdrop: `rgba(0,0,0,0.7)`
        }).then((result) => {
            if (result.isConfirmed) {
                // Jangan lupa lempar stringDetailAnggota ke fungsi kirim
                kirimKeSpreadsheet(groupId, nilaiAkhir, rataRataAnggota, status, stringDetailAnggota);
            }
        });
    }

    function kirimKeSpreadsheet(groupId, nilaiAkhir, rataRataAnggota, status, stringDetailAnggota) {
        if(SCRIPT_URL === "URL_GOOGLE_APPS_SCRIPT_ANDA_DISINI") {
            Swal.fire('Perhatian!', 'URL Google Apps Script belum dimasukkan.', 'info');
            return;
        }

        Swal.fire({
            title: 'Menyandikan Sejarah...',
            html: 'Menyimpan detail nilai tiap anggota ke markas pusat...',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading() }
        });

        // Tambahkan detailAnggota ke dalam data yang dikirim (payload JSON)
        const dataKirim = {
            kelas: globalConfig.kelas,
            jurusan: globalConfig.jurusan,
            kelompok: `Kelompok ${groupId}`,
            rataRataAnggota: rataRataAnggota,
            nilaiAkhir: nilaiAkhir,
            predikat: status,
            detailAnggota: stringDetailAnggota // <-- Data baru dikirim ke Apps Script
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(dataKirim)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                Swal.fire({
                    title: 'Tersimpan!', 
                    text: 'Sejarah dan nilai lengkap anggota telah diabadikan.', 
                    icon: 'success',
                    showClass: { popup: 'animate__animated animate__zoomIn' }
                });
                const btn = document.querySelector(`#group-${groupId} .btn-submit-nilai`);
                btn.disabled = true;
                btn.innerHTML = "✅ Data Tersimpan";
                btn.style.background = "linear-gradient(45deg, #7f8c8d, #95a5a6)";
            }
        })
        .catch(error => {
            Swal.fire('Gagal Menyimpan', 'Periksa koneksi internet Anda.', 'error');
        });
    }

    function kirimKeSpreadsheet(groupId, nilaiAkhir, rataRataAnggota, status) {
        if(SCRIPT_URL === "https://script.google.com/macros/s/AKfycbx9jhY_5n0hM3Q7LRJcKtnNQklmJR1lKMzSEYpCZzdm0XnVUnyLRv6vkicaaUVXOsyA/exec") {
            Swal.fire('Perhatian!', 'URL Google Apps Script belum dimasukkan di dalam kode.', 'info');
            return;
        }

        Swal.fire({
            title: 'Menyandikan Sejarah...',
            html: 'Menyimpan data ke markas pusat (Spreadsheet)',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading() }
        });

        const dataKirim = {
            kelas: globalConfig.kelas,
            jurusan: globalConfig.jurusan,
            kelompok: `Kelompok ${groupId}`,
            rataRataAnggota: rataRataAnggota,
            nilaiAkhir: nilaiAkhir,
            predikat: status
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(dataKirim)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                Swal.fire({
                    title: 'Tersimpan!', 
                    text: 'Sejarah kelompok telah diabadikan.', 
                    icon: 'success',
                    showClass: { popup: 'animate__animated animate__zoomIn' }
                });
                const btn = document.querySelector(`#group-${groupId} .btn-submit-nilai`);
                btn.disabled = true;
                btn.innerHTML = "✅ Data Tersimpan";
                btn.style.background = "linear-gradient(45deg, #7f8c8d, #95a5a6)";
            }
        })
        .catch(error => {
            Swal.fire('Gagal Menyimpan', 'Periksa koneksi internet Anda.', 'error');
        });
    }
</script>

</body>
</html>
